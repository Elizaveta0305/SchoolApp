name: .NET CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      name: Checkout code

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies

      run: dotnet restore SchoolApplication/SchoolApplication.sln

    - name: Build solution
    
      run: dotnet build SchoolApplication/SchoolApplication.sln --no-restore

    - name: Run Unit Tests
    
      run: dotnet test SchoolApplication.Tests/SchoolApplication.Tests.csproj --no-build --verbosity normal

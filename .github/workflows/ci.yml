name: .NET CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      name: Checkout code

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      working-directory: SchoolApplication
      run: dotnet restore SchoolApplication.sln

    - name: Build solution
      working-directory: SchoolApplication
      run: dotnet build SchoolApplication.sln --no-restore

    - name: Run Unit Tests

      run: dotnet test SchoolApplication.Tests/SchoolApplication.Tests.csproj --no-build --verbosity normal

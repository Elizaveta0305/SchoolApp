name: .NET CI Pipeline - SchoolApplication

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      name: Checkout code

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      working-directory: SchoolApplication
      run: dotnet restore SchoolApplication.sln

    - name: Build solution
      working-directory: SchoolApplication
      run: dotnet build SchoolApplication.sln --no-restore --configuration Release

    - name: Install Coverlet and ReportGenerator
      run: |
        dotnet nuget locals all --clear
        Write-Host "NuGet caches cleared successfully."

        dotnet tool install --global coverlet.console --version 6.0.0
        Write-Host "Coverlet installed successfully."

        dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.3.0
        Write-Host "ReportGenerator installed successfully."

    - name: Run Unit Tests with Coverage
      working-directory: .
      shell: pwsh
      run: |
        (dotnet test `
          "SchoolApplication.Tests/SchoolApplication.Tests.csproj" `
          --no-build `
          --configuration Release `
          /p:CollectCoverage=true ` 
          /p:CoverletOutputFormat=cobertura `
          /p:CoverletOutput="./TestResults/coverage.cobertura.xml" `
          /p:CoverletOutputFiltering="+[SchoolApplication]*" `
          /p:ExcludeByFile="*Designer.cs;*Migrations.cs;*.g.cs;*Tests.cs;App.xaml.cs;App.xaml;MainWindow.xaml.cs;MainWindow.xaml;Views/**/*.xaml.cs;Views/**/*.xaml;Windows/**/*.xaml.cs;Controls/**/*.xaml.cs" `
          /p:ExcludeByAttribute="System.Diagnostics.CodeAnalysis.ExcludeFromCodeCoverageAttribute;System.Diagnostics.DebuggerNonUserCodeAttribute;System.CodeDom.Compiler.GeneratedCodeAttribute" `
          /p:IncludeTestAssembly=false ` 
          --results-directory "./TestResults" `
          --logger "trx;LogFileName=test_results.trx" `
          --verbosity normal `
        )

    - name: Check Cobertura XML for View files
      working-directory: .
      shell: pwsh
      run: |
        $coverageFile = Get-ChildItem -Path "./TestResults" -Recurse -Filter "coverage.cobertura.xml" | Select-Object -ExpandProperty FullName
        if ($coverageFile) {
            Write-Host "Found Cobertura XML at: $($coverageFile)"
            Write-Host "--- Searching for 'Views' or 'xaml' in XML ---"
            Get-Content $coverageFile | Select-String -Pattern "Views|xaml" -Context 0,5
            Write-Host "--- End of search ---"
        } else {
            Write-Host "Cobertura XML file not found. Please check previous steps and paths."
            exit 1
        }

    - name: Generate Coverage Report
      working-directory: .
      shell: pwsh
      run: |
        reportgenerator `
          "-reports:./TestResults/coverage.cobertura.xml" ` # Теперь ReportGenerator должен найти этот файл
          "-targetdir:./CoverageReport" `
          "-reporttypes:Html" `
          "-assemblyfilters:+SchoolApplication;+SchoolApplication.ViewModels" `
          "-filefilters:-*Tests;+*;-*Migrations*;**/*Views*/**"
      
    - name: Upload Test Results Artifact (Optional, но полезно для отладки)
      uses: actions/upload-artifact@v4
      with:
        name: TestResults
        path: TestResults/
        retention-days: 1

    - name: Upload Coverage Report Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CodeCoverageReport
        path: CoverageReport/
        retention-days: 1

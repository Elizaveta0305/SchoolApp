name: .NET CI Pipeline - SchoolApplication

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      name: Checkout code

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      working-directory: SchoolApplication
      run: dotnet restore SchoolApplication.sln

    - name: Build solution
      working-directory: SchoolApplication
      run: dotnet build SchoolApplication.sln --no-restore --configuration Release

    - name: Install Coverlet and ReportGenerator
      run: |
        # Очищаем кэш NuGet для предотвращения проблем с установкой инструментов.
        dotnet nuget locals all --clear
        Write-Host "NuGet caches cleared successfully."

        # Установка coverlet.console. Используем актуальную стабильную версию.
        dotnet tool install --global coverlet.console --version 6.0.0
        Write-Host "Coverlet installed successfully."

        # Установка dotnet-reportgenerator-globaltool. Используем актуальную стабильную версию.
        dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.3.0
        Write-Host "ReportGenerator installed successfully."

    - name: Run Unit Tests with Coverage
      working-directory: . 
      shell: pwsh
      run: |
        dotnet test `
          SchoolApplication.Tests/SchoolApplication.Tests.csproj ` # <--- Путь к проекту тестов относительно корня репозитория
          --no-build `
          --configuration Release `
          --collect:"XPlat Code Coverage" `
          --settings "SchoolApplication.Tests/test.runsettings" ` # <--- ПУТЬ К test.runsettings
          --results-directory "./TestResults" `
          --logger "trx;LogFileName=test_results.trx" `
          --verbosity normal

    - name: Generate Coverage Report
      working-directory: .
      shell: pwsh
      run: |
        reportgenerator `
          "-reports:./TestResults/**/coverage.cobertura.xml" ` # Источник данных покрытия
          "-targetdir:./CoverageReport" ` # Целевая папка для HTML-отчета
          "-reporttypes:Html" ` # Тип отчета
          # Фильтры:
          # +SchoolApplication; +SchoolApplication.ViewModels: включаем основной проект и ViewModels.
          # -*Tests: исключаем тестовые файлы.
          # -*Migrations*: исключаем файлы миграций.
          # **/*Views*/**: исключаем файлы, содержащие "Views" в пути (например, XAML).
          "-assemblyfilters:+SchoolApplication;+SchoolApplication.ViewModels" ` # <--- ФИЛЬТРЫ ДЛЯ ВАШЕГО ПРОЕКТА
          "-filefilters:-*Tests;+*;-*Migrations*;**/*Views*/**"
      
    - name: Upload Test Results Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TestResults
        path: TestResults/
        retention-days: 1

    - name: Upload Coverage Report Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CodeCoverageReport
        path: CoverageReport/
        retention-days: 1

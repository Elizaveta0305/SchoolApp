name: .NET CI Pipeline - SchoolApplication

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      name: Checkout code

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      working-directory: SchoolApplication
      run: dotnet restore SchoolApplication.sln

    - name: Build solution
      working-directory: SchoolApplication
      run: dotnet build SchoolApplication.sln --no-restore --configuration Release

    - name: Install Coverlet and ReportGenerator
      run: |
        dotnet nuget locals all --clear
        dotnet tool install --global coverlet.console --version 6.0.0
        dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.3.0

    - name: Run Unit Tests with Coverage
      working-directory: .
      shell: pwsh
      run: |
        dotnet test `
          SchoolApplication.Tests/SchoolApplication.Tests.csproj `
          --no-build `
          --configuration Release `
          --collect:"XPlat Code Coverage" ` # Используем VSTest Data Collector
          --settings "SchoolApplication.Tests/test.runsettings" ` # Указываем файл настроек
          --results-directory "./TestResults" `
          --logger "trx;LogFileName=test_results.trx" `
          --verbosity normal

    - name: Check Cobertura XML for View files
      working-directory: .
      shell: pwsh
      run: |
        $coverageFile = Get-ChildItem -Path "./TestResults" -Recurse -Filter "coverage.cobertura.xml" | Select-Object -ExpandProperty FullName
        if ($coverageFile) {
            Get-Content $coverageFile | Select-String -Pattern "Views|xaml" -Context 0,5
        } else {
            exit 1
        }

    - name: Generate Coverage Report
      working-directory: .
      shell: pwsh
      run: |
        reportgenerator `
          "-reports:./TestResults/**/coverage.cobertura.xml" `
          "-targetdir:./CoverageReport" `
          "-reporttypes:Html" `
          "-assemblyfilters:+SchoolApplication;+SchoolApplication.ViewModels" `
          "-filefilters:-*Tests;+*;-*Migrations*;**/*Views*/**"
      
    - name: Upload Test Results Artifact (Optional, но полезно для отладки)
      uses: actions/upload-artifact@v4
      with:
        name: TestResults
        path: TestResults/
        retention-days: 1

    - name: Upload Coverage Report Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CodeCoverageReport
        path: CoverageReport/
        retention-days: 1
